name: acmg
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python base
  - python=3.11

  # Bioinformatics tools (conda)
  - bcftools=1.21
  - samtools=1.21
  - htslib=1.21

  # Python bioinformatics (conda)
  - cyvcf2

  # Scientific computing (conda for better compatibility)
  - numpy
  - scipy

  # Package manager
  - pip

  # Pip packages - direct dependencies only
  - pip:
      # Core web framework
      - fastapi==0.136.1
      - uvicorn==0.46.0
      - python-multipart==0.0.27
      - python-dotenv==1.2.2

      # Database & ORM
      - sqlalchemy==2.0.49
      - psycopg2-binary==2.9.12
      - pgvector==0.4.2
      - redis==7.4.0

      # Task queue
      - celery==5.6.3

      # AI/ML - LangChain & LangGraph
      - langchain-classic==1.0.7
      - langchain-community==0.4.1
      - langchain-core==1.3.3
      - langchain-text-splitters==1.1.2
      - langgraph==1.1.10
      - langgraph-checkpoint==4.0.3
      - langgraph-prebuilt==1.0.13
      - langgraph-sdk==0.3.14
      - langsmith==0.8.3

      # Vector database
      - chromadb==1.5.9

      # Embeddings & transformers
      - sentence-transformers==5.4.1
      - transformers==5.8.0

      # PyTorch (CPU version for AWS - adjust if you need CUDA)
      - torch==2.5.1
      - torchvision==0.20.1
      - torchaudio==2.5.1

      # LLM providers
      - openai==2.36.0
      - boto3  # for AWS Bedrock

      # Data manipulation
      - pandas==3.0.2

      # Bioinformatics Python tools
      - biopython==1.87
      - pysam==0.24.0

      # Document processing
      - PyMuPDF  # imports as 'fitz'
      - PyPDF2
      - openpyxl==3.1.5

      # Clinical/Medical
      - hpo3==1.5.1

      # Data validation
      - pydantic==2.13.4
      - pydantic-settings==2.14.0

      # Authentication
      - bcrypt==5.0.0

      # HTTP clients
      - requests==2.33.1
      - httpx==0.28.1

      # Templating
      - jinja2==3.1.6

      # Utilities
      - typer==0.25.1
      - rich==15.0.0
      - loguru==0.7.3
      - tqdm==4.67.3

      # Testing
      - pytest==9.0.3
      - pytest-asyncio==1.3.0
